<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Festivite — Crie seu convite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-page:#000000;
    --bg-card:#1b1c1f;
    --bg-input:#141517;
    --bg-input-hover:#1a1b1e;
    --border-subtle: rgba(255,255,255,0.08);
    --border-input: rgba(255,255,255,0.10);
    --text-primary:#ffffff;
    --text-secondary:#9a9aa2;
    --text-placeholder:#6f6f78;
    --accent-blue:#3b82f6;
    --accent-blue-dim: rgba(59,130,246,0.15);
    --accent-pink:#ec4899;
    --accent-red:#ef4444;
    --radius-card: 32px;
    --radius-field: 12px;
  }
  
  *{ box-sizing:border-box; }
  
  body{
    margin:0;
    background: var(--bg-page);
    font-family:'Poppins', sans-serif;
    color: var(--text-primary);
  }
  
  /* Layout: painel da imagem fixo + conteúdo rolando com a página (sem scrollbar própria) */
  .page{
    display:flex;
    align-items:flex-start;
    min-height:100vh;

  }
/* ---------- PAINEL DA MARCA (FIXO) ---------- */

.brand-panel {
  position: sticky;
  top: 0;
  width: 400px;
  min-width: 400px;
  height: 100vh;
  overflow: hidden;
  background: #000;
  border-right: 1px solid var(--border);
}

content {
    overflow:auto;
    padding: 4rem;
}
  aside {
    position: relative; /* necessário para o absolute do filho funcionar */
    scroll-padding-top: 1rem;

    & .aside-container {
        & #bolo {
            width: 25rem;
            height: 45.5rem;
            border-radius: .5rem;
        }
        
        & .titulo-image {
            position: absolute;/* corrigido: era "display: absolute" */
            top: 2rem;
            left: 2rem;
            z-index: 2; /* garante que fique acima da imagem */
            
            & #logo {
                width: 2.86rem; /* corrigido: vírgula trocada por ponto */
                height: 3rem;
                /* margin-top: 0.5rem; */
            }
            
            & h1 {
                font: 600 2.5rem/1.25 var(--font-family);
                color: #ff598b;
                /* margin-bottom: 0.1rem; */
            }
            
            & p {
                font:var(--heading-md); /* ajuste conforme seu design */
                color: var(--text-heading);
            }
        }
    }
}



  .brand-panel{
    position: sticky;
    top: 0;
    width: 38%;
    max-width: 460px;
    min-width: 280px;
    height: 100vh;
    flex-shrink: 0;
    overflow: hidden;
    background:#000;
  }
  .brand-panel img{
    width:100%;
    height:100%;
    object-fit: cover;
    display:block;
  }

  .content{
    flex:1;
    display:flex;
    justify-content:center;
    padding: 48px 16px;
    min-width:0;
  }

  .card{
    width:100%;
    max-width:720px;
    background: var(--bg-card);
    border-radius: var(--radius-card);
    border: 1px solid var(--border-subtle);
    padding: 40px 44px 36px;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.6);
  }

  @media (max-width: 900px){
    .page{ flex-direction: column; }
    .brand-panel{
      position: relative;
      width:100%;
      max-width:none;
      min-width:0;
      height: 240px;
    }
    .content{ padding: 32px 16px 48px; }
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 28px;
  }
  .brand .emoji{ font-size: 22px; }
  .brand .name{
    font-family:'Pacifico', cursive;
    font-size: 22px;
    color: var(--accent-pink);
    letter-spacing:.3px;
  }

  h1.page-title{
    font-size: 26px;
    font-weight: 700;
    margin: 4px 0 32px;
  }

  .section{ margin-bottom: 36px; }

  .section-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 20px;
  }
  .section-header .icon{
    width:20px; height:20px;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-primary);
    flex-shrink:0;
  }
  .section-header h2{
    font-size: 16px;
    font-weight:600;
    margin:0;
  }

  .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap: 20px;
  }

  .field{ margin-bottom:20px; }
  .field:last-child{ margin-bottom:0; }

  label.field-label{
    display:block;
    font-size: 13.5px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  input[type="text"],
  input[type="email"],
  input[type="tel"],
  textarea{
    width:100%;
    background: var(--bg-input);
    border: 1px solid var(--border-input);
    border-radius: var(--radius-field);
    color: var(--text-primary);
    font-family:'Poppins', sans-serif;
    font-size: 14.5px;
    padding: 13px 16px;
    outline:none;
    transition: border-color .15s ease, background .15s ease;
  }
  input::placeholder, textarea::placeholder{ color: var(--text-placeholder); }
  input:focus, textarea:focus{
    border-color: var(--accent-blue);
    background: var(--bg-input-hover);
  }

  textarea{
    resize: vertical;
    min-height: 96px;
    font-family:'Poppins', sans-serif;
    line-height:1.5;
  }

  /* Tipo segmented control */
  .segmented{
    display:inline-flex;
    background: var(--bg-input);
    border: 1px solid var(--border-input);
    border-radius: var(--radius-field);
    padding: 4px;
    gap:4px;
  }
  .segmented button{
    display:flex;
    align-items:center;
    gap:6px;
    border:none;
    background: transparent;
    color: var(--text-secondary);
    font-family:'Poppins', sans-serif;
    font-size: 13.5px;
    font-weight:500;
    padding: 9px 16px;
    border-radius: 9px;
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
  }
  .segmented button svg{ width:15px; height:15px; }
  .segmented button.active{
    background: #2a2b30;
    color: var(--text-primary);
  }

  /* Color swatches */
  .swatches{
    display:flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .swatch{
    width: 34px; height:34px;
    border-radius:50%;
    cursor:pointer;
    border: 3px solid transparent;
    outline: 2px solid transparent;
    outline-offset: 2px;
    transition: outline-color .15s ease;
    position:relative;
  }
  .swatch.selected{
    outline: 2px solid #ffffff;
  }
  .swatch.selected::after{
    content:"";
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border: 2px solid currentColor;
  }

  /* Theme grid */
  .theme-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-top: 12px;
  }
  .theme-card{
    border-radius: 14px;
    overflow:hidden;
    cursor:pointer;
    border: 2px solid transparent;
    background: var(--bg-input);
    transition: border-color .15s ease, transform .1s ease;
  }
  .theme-card:hover{ transform: translateY(-2px); }
  .theme-card.selected{
    border-color: var(--accent-blue);
  }
  .theme-thumb{
    width:100%;
    aspect-ratio: 1.2 / 1;
    background-size: cover;
    background-position:center;
  }
  .theme-label{
    font-size: 12.5px;
    text-align:center;
    padding: 8px 4px 10px;
    color: var(--text-primary);
  }

  /* thumbnails via css gradients (stand-ins for photos) */
  .thumb-aniversario{ background-image: url(assests/icons/aniversario.svg); }
  .thumb-infantil{ background-image:url(assests/icons/infantil.svg); }
  .thumb-formatura{ background-image:url(assests/icons/formatura.svg) ; }
  .thumb-casamento{ background-image:url(assests/icons/casamento.svg); }
  .thumb-cha-bebe{ background-image:url(assests/icons/cha-de-beve.svg); }
  .thumb-cha-panela{ background-image:url(assests/icons/cha-de-panela.svg); }
  .thumb-carnaval{ background-image:url(assests/icons/carnaval.svg); }
  .thumb-pascoa{ background-image:url(assests/icons/pascoa.svg); }
  .thumb-sao-joao{ background-image:url(assests/icons/sao-joao.svg); }
  .thumb-halloween{ background-image:url(assests/icons/halloween.svg); }
  .thumb-natal{ background-image:url(assests/icons/natal.svg) ; }
  .thumb-outro{ background-image:url(assests/icons/outro.svg) ; }

  /* Estilo + Foto de capa row */
  .row-style{
    display:grid;
    grid-template-columns: 1fr 2fr;
    gap: 24px;
    margin-top: 8px;
  }

  .toggle-wrap{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .file-upload{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .btn-select{
    display:flex;
    align-items:center;
    gap:8px;
    background: #2a2b30;
    color: var(--text-primary);
    border: 1px solid var(--border-input);
    border-radius: 10px;
    padding: 10px 16px;
    font-family:'Poppins', sans-serif;
    font-size: 13.5px;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-select svg{ width:15px; height:15px; }
  .file-name{
    font-size: 13.5px;
    color: var(--text-placeholder);
  }

  /* error state */
  .field.error input{
    border-color: var(--accent-red);
  }
  .error-msg{
    display:flex;
    align-items:center;
    gap:6px;
    color: var(--accent-red);
    font-size: 12.5px;
    margin-top: 8px;
  }
  .error-msg svg{ width:14px; height:14px; flex-shrink:0; }

  hr.divider{
    border:none;
    border-top: 1px solid var(--border-subtle);
    margin: 28px 0 20px;
  }

  .checkbox-list{
    display:flex;
    flex-direction:column;
    gap: 14px;
    margin-bottom: 28px;
  }
  .checkbox-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    cursor:pointer;
  }
  .checkbox-row input[type="checkbox"]{
    appearance:none;
    -webkit-appearance:none;
    width:18px; height:18px;
    border-radius:5px;
    border: 1.5px solid var(--border-input);
    background: var(--bg-input);
    margin:0;
    flex-shrink:0;
    cursor:pointer;
    position:relative;
    top:1px;
  }
  .checkbox-row input[type="checkbox"]:checked{
    background: var(--accent-blue);
    border-color: var(--accent-blue);
  }
  .checkbox-row input[type="checkbox"]:checked::after{
    content:"";
    position:absolute;
    left:5px; top:1px;
    width:5px; height:9px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .checkbox-row .txt{
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height:1.5;
  }
  .checkbox-row a{
    color: var(--accent-blue);
    text-decoration: none;
    font-weight:500;
  }
  .checkbox-row a:hover{ text-decoration: underline; }

  .submit-wrap{
    display:flex;
    justify-content:flex-end;
  }
  .btn-submit{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--accent-blue);
    color:#fff;
    border:none;
    border-radius: 12px;
    padding: 13px 24px;
    font-family:'Poppins', sans-serif;
    font-size: 14.5px;
    font-weight:600;
    cursor:pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .btn-submit:hover{ background:#2f6fe0; }
  .btn-submit:active{ transform: scale(0.98); }
  .btn-submit svg{ width:17px; height:17px; }

  @media (max-width: 620px){
    .card{ padding: 28px 20px 24px; border-radius: 24px; }
    .row, .row-style{ grid-template-columns: 1fr; gap: 16px; }
    .theme-grid{ grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="page">

  <aside class="brand-panel">
    <div class="aside-container">
        <img id="bolo" src="assests/Background.svg" alt="bolo da festa">
        <div class="titulo-image">
            <header>
                <img id="logo" src="assests/Logo.svg" alt="logo de festa">
                <h1>Festiwite</h1>
                <p>Crie um convite digital para o seu evento</p>
            </header>
        </div>
    </div>
  </aside>

  <div class="content">
  <div class="card">

  <!-- <div class="brand">
    <span class="emoji">🎉</span>
    <span class="name">Festivite</span>
  </div> -->

  <main class="form-panel">
    <form id="inviteForm">
      <h1 class="page-title">Crie seu convite</h1>

      <!-- Sobre o evento -->
      <div class="section">
        <div class="section-header">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </span>
          <h2>Sobre o evento</h2>
        </div>

        <div class="field">
          <label class="field-label">Título</label>
          <input type="text" placeholder="Nome do evento">
        </div>

        <div class="row">
          <div class="field">
            <label class="field-label">Início</label>
            <input type="text" placeholder="DD/MM/AAAA, --:--">
          </div>
          <div class="field">
            <label class="field-label">Fim</label>
            <input type="text" placeholder="DD/MM/AAAA, --:--">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label class="field-label">Tipo</label>
            <div class="segmented" id="tipoSegment">
              <button type="button" class="active" data-tipo="presencial">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M9 9h1M9 13h1M14 9h1M14 13h1M10 21v-4h4v4"/></svg>
                Presencial
              </button>
              <button type="button" data-tipo="online">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg>
                Online
              </button>
            </div>
          </div>
          <div class="field">
            <label class="field-label">Local</label>
            <input type="text" placeholder="Link ou endereço">
          </div>
        </div>

        <div class="field">
          <label class="field-label">Descrição</label>
          <textarea placeholder="Escreva sobre os detalhes do evento"></textarea>
        </div>
      </div>

      <!-- Personalização -->
      <div class="section">
        <div class="section-header">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a1 1 0 0 1-1-1v-2.586a1 1 0 0 0-.293-.707L2.586 9.586A2 2 0 0 1 2 8.172V6a2 2 0 0 1 2-2h2.172a2 2 0 0 1 1.414.586l8.121 8.121a1 1 0 0 0 .707.293H19a1 1 0 0 1 1 1v2a2 2 0 0 1-2 2h-2"/><circle cx="6.5" cy="6.5" r="1.5"/></svg>
          </span>
          <h2>Personalização</h2>
        </div>

        <div class="field">
          <label class="field-label">Cor principal</label>
          <div class="swatches" id="colorSwatches">
            <div class="swatch selected" style="background:#4c9be8; color:#4c9be8;"></div>
            <div class="swatch" style="background:#6c6de0; color:#6c6de0;"></div>
            <div class="swatch" style="background:#9757d1; color:#9757d1;"></div>
            <div class="swatch" style="background:#e364a6; color:#e364a6;"></div>
            <div class="swatch" style="background:#ea4c6a; color:#ea4c6a;"></div>
            <div class="swatch" style="background:#e8543f; color:#e8543f;"></div>
            <div class="swatch" style="background:#ef8b45; color:#ef8b45;"></div>
            <div class="swatch" style="background:#f0bd4a; color:#f0bd4a;"></div>
            <div class="swatch" style="background:#d3e34f; color:#d3e34f;"></div>
            <div class="swatch" style="background:#4ecf78; color:#4ecf78;"></div>
            <div class="swatch" style="background:#3fd6d0; color:#3fd6d0;"></div>
          </div>
        </div>

        <div class="field">
          <label class="field-label">Tema do evento</label>
          <div class="theme-grid" id="themeGrid">
            <div class="theme-card selected" data-theme="aniversario">
              <div class="theme-thumb thumb-aniversario"></div>
              <div class="theme-label">Aniversário</div>
            </div>
            <div class="theme-card" data-theme="infantil">
              <div class="theme-thumb thumb-infantil"></div>
              <div class="theme-label">Infantil</div>
            </div>
            <div class="theme-card" data-theme="formatura">
              <div class="theme-thumb thumb-formatura"></div>
              <div class="theme-label">Formatura</div>
            </div>
            <div class="theme-card" data-theme="casamento">
              <div class="theme-thumb thumb-casamento"></div>
              <div class="theme-label">Casamento</div>
            </div>
            <div class="theme-card" data-theme="cha-bebe">
              <div class="theme-thumb thumb-cha-bebe"></div>
              <div class="theme-label">Chá de bebê</div>
            </div>
            <div class="theme-card" data-theme="cha-panela">
              <div class="theme-thumb thumb-cha-panela"></div>
              <div class="theme-label">Chá de panela</div>
            </div>
            <div class="theme-card" data-theme="carnaval">
              <div class="theme-thumb thumb-carnaval"></div>
              <div class="theme-label">Carnaval</div>
            </div>
            <div class="theme-card" data-theme="pascoa">
              <div class="theme-thumb thumb-pascoa"></div>
              <div class="theme-label">Páscoa</div>
            </div>
            <div class="theme-card" data-theme="sao-joao">
              <div class="theme-thumb thumb-sao-joao"></div>
              <div class="theme-label">São João</div>
            </div>
            <div class="theme-card" data-theme="halloween">
              <div class="theme-thumb thumb-halloween"></div>
              <div class="theme-label">Halloween</div>
            </div>
            <div class="theme-card" data-theme="natal">
              <div class="theme-thumb thumb-natal"></div>
              <div class="theme-label">Natal</div>
            </div>
            <div class="theme-card" data-theme="outro">
              <div class="theme-thumb thumb-outro"></div>
              <div class="theme-label">Outro</div>
            </div>
          </div>
        </div>

        <div class="row-style">
          <div class="field">
            <label class="field-label">Estilo</label>
            <div class="segmented" id="estiloSegment">
              <button type="button" data-estilo="claro">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                Claro
              </button>
              <button type="button" class="active" data-estilo="escuro">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                Escuro
              </button>
            </div>
          </div>
          <div class="field">
            <label class="field-label">Foto de capa</label>
            <div class="file-upload">
              <button type="button" class="btn-select" id="btnSelectFile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
                Selecionar
              </button>
              <span class="file-name" id="fileNameLabel">Nenhum arquivo selecionado</span>
              <input type="file" id="fileInput" hidden accept="image/*">
            </div>
          </div>
        </div>
      </div>

      <!-- Dados para contato -->
      <div class="section">
        <div class="section-header">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M6.5 19c1-2.5 3-4 5.5-4s4.5 1.5 5.5 4"/></svg>
          </span>
          <h2>Dados para contato</h2>
        </div>

        <div class="field error" id="nomeField">
          <label class="field-label">Nome</label>
          <input type="text" id="nomeInput" placeholder="Nome completo">
          <div class="error-msg" id="nomeError">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
            Campo obrigatório
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label class="field-label">E-mail</label>
            <input type="email" placeholder="exemplo@email.com">
          </div>
          <div class="field">
            <label class="field-label">Telefone</label>
            <input type="tel" placeholder="(99) 99999-9999">
          </div>
        </div>
      </div>

      <hr class="divider">

      <div class="checkbox-list">
        <label class="checkbox-row">
          <input type="checkbox" checked>
          <span class="txt">Li e concordo com os <a href="#">Termos e Condições</a> e com a <a href="#">Política de Privacidade</a></span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox">
          <span class="txt">Aceito receber atualizações e promoções por e-mail</span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox">
          <span class="txt">Aceito receber atualizações e promoções por SMS</span>
        </label>
      </div>

      <div class="submit-wrap">
        <button type="submit" class="btn-submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v3a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3a3 3 0 0 1 0-6V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v3z"/><path d="M9 4v16" stroke-dasharray="4 4"/></svg>
          Gerar convite
        </button>
      </div>

    </form>
  </main>
  </div>
  </div>

</div>

<script>
  // Segmented control: Tipo
  document.querySelectorAll('#tipoSegment button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#tipoSegment button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  // Color swatches
  document.querySelectorAll('#colorSwatches .swatch').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      document.querySelectorAll('#colorSwatches .swatch').forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
    });
  });

  // Theme grid
  document.querySelectorAll('#themeGrid .theme-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      document.querySelectorAll('#themeGrid .theme-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
    });
  });

  // Estilo: Claro / Escuro
  document.querySelectorAll('#estiloSegment button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#estiloSegment button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  // File upload
  const fileInput = document.getElementById('fileInput');
  const btnSelectFile = document.getElementById('btnSelectFile');
  const fileNameLabel = document.getElementById('fileNameLabel');
  btnSelectFile.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', ()=>{
    fileNameLabel.textContent = fileInput.files.length ? fileInput.files[0].name : 'Nenhum arquivo selecionado';
  });

  // Simple required-field validation for Nome
  const form = document.getElementById('inviteForm');
  const nomeField = document.getElementById('nomeField');
  const nomeInput = document.getElementById('nomeInput');
  const nomeError = document.getElementById('nomeError');

  function validateNome(){
    const filled = nomeInput.value.trim().length > 0;
    nomeField.classList.toggle('error', !filled);
    nomeError.style.display = filled ? 'none' : 'flex';
    return filled;
  }

  nomeInput.addEventListener('input', validateNome);
  validateNome(); // reflects initial "campo obrigatório" state as in the design

  form.addEventListener('submit', (e)=>{
    e.preventDefault();
    if(!validateNome()){
      nomeInput.focus();
      return;
    }
    alert('Convite gerado! 🎉');
  });
</script>

</body>
</html>
